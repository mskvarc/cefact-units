[package]
name = "cefact-units"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "UN/CEFACT Recommendation No. 20 — units of measure"

[features]
default = []
serde = ["dep:serde"]
case-insensitive = []
generated-tests = []

[dependencies]
cefact-units-macros = { path = "../cefact-units-macros" }
serde = { version = "1.0.228", features = ["derive"], optional = true }

[dev-dependencies]
serde_json = "1.0.149"
